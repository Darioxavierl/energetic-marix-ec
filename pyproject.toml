[tool.pyright]
include = ["src", "cenace_scraper_service", "cenace_scraper_service/src"]
extraPaths = ["cenace_scraper_service", "cenace_scraper_service/src"]
venvPath = "cenace_scraper_service"
venv = ".venv"

[tool.poetry]
name = "energetico"
version = "0.1.0"
description = "Simulador de la Matriz Energética del Ecuador"
authors = ["Dario Portilla <dario@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pyqt6 = "^6.6.1"
pyqt6-webengine = "^6.6.1"
pydantic = "^2.4.2"
pyyaml = "^6.0.1"
pyproj = "^3.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
black = "^23.7.0"
ruff = "^0.1.3"
mypy = "^1.4.1"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
select = ["E", "F", "W", "I"]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
markers = [
	"integration: pruebas de integracion contra servicios externos",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
